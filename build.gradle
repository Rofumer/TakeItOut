plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "takeitout" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    // Meteor?
    // maven { url = "https://maven.meteordev.org/releases" }
    // maven { url = "https://maven.meteordev.org/snapshots" }

    // Forge Maven
    // maven { url = "https://www.cursemaven.com" }

    // Modrinth Maven
    maven { url = "https://api.modrinth.com/maven" }

    // Masa Mods
    maven { url = "https://masa.dy.fi/maven/sakura-ryoko" }
    maven { url = "https://maven.fallenbreath.me/releases" }

    // ModMenu
    maven { url = "https://maven.terraformersmc.com/"}
    maven { url = "https://jitpack.io" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation("fi.dy.masa.malilib:malilib-fabric-26.2:0.29.2")
    implementation("fi.dy.masa.litematica:litematica-fabric-26.2:0.28.2")
    implementation("fi.dy.masa.tweakeroo:tweakeroo-fabric-26.2:0.29.2")
    implementation("maven.modrinth:litematica-printer:3.2.2")

    implementation "com.terraformersmc:modmenu:20.0.0-beta.1"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand(
                "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
        )
    }
}

def targetJavaVersion = 25

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }

    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
